config_version = 15

[bar.default]
border = "surface_variant"
capsule = true
end = [ "group:g2", "network", "bluetooth", "volume", "session" ]
font_family = "JetBrainsMono Nerd Font Propo"
margin_ends = 0
padding = 16
radius = 0
radius_bottom_left = 24
radius_bottom_right = 24
start = [ "workspaces", "group:g1" ]
widget_spacing = 8

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "media", "audio_visualizer" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "tray", "notifications", "clipboard" ]
    opacity = 1.0
    padding = 6.0

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
app_icon_color = "on_surface"
app_icon_colorize = true
font_family = "JetBrainsMono Nerd Font Propo"

[theme]
builtin = "Catppuccin"
community_palette = "Catppuccin Macchiato Pink"
mode = "dark"
shell_mode = "dark"
source = "community"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "~/.local/share/wallpapers"

    [wallpaper.default]
    path = "~/.local/share/wallpapers/yoho.jpg"

[widget.media]
hide_when_idle = true
hide_when_no_media = true